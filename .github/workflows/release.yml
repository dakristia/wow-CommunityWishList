name: Release

# Pushing an annotated version tag (for example v0.1.0-alpha) builds the zip and uploads it to CurseForge.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CURSEFORGE_GITHUB_API_KEY }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
